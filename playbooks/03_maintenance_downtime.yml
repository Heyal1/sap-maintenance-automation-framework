# ============================================================================
# SAP Maintenance: Set Icinga Downtime
# ============================================================================
# Sets Icinga maintenance downtime for target hosts.
# Separated from PreCheck to avoid double downtimes on pipeline re-runs.
# Pipeline Stage: 2. StopPrepare (first step)
# ============================================================================
- name: "SAP Maintenance: Set Icinga Downtime"
  hosts: all
  gather_facts: true
  become: true

  vars:
    do_kernel: false
    do_hana: false
    do_os_patch: false

  vars_files:
    - ../vars/common.yml

  tasks:
    - name: "Run downtime workflow"
      block:
        - name: "Log active switch values"
          include_tasks: tasks/log_switch_state.yml

        - name: "Run shared SAP discovery"
          include_tasks: tasks/discover_sap_facts.yml

        - name: "Run Icinga discovery"
          include_tasks: tasks/discover_icinga_facts.yml
          when: not (skip_icinga | default(false) | bool)

        - name: "Ensure run-scoped state directory exists"
          include_tasks: tasks/create_state_directory.yml

        - name: "Calculate downtime duration in seconds"
          set_fact:
            _downtime_duration_seconds: "{{ (downtime_duration_minutes | default(60) | int) * 60 }}"

        - name: "Evaluate downtime workflow state"
          set_fact:
            _icinga_bypass_active: "{{ ('true' if (skip_icinga | default(false) | bool) else 'false') | from_yaml }}"
            _icinga_downtime_set: "{{ ('true' if (((icinga_downtime_targets | default([]) | length) > 0) and ((do_kernel | bool) or (do_hana | bool) or (do_os_patch | bool)) and not (skip_icinga | default(false) | bool)) else 'false') | from_yaml }}"

        - name: "Build downtime audit state"
          set_fact:
            icinga_downtime_state:
              host: "{{ inventory_hostname }}"
              sid: "{{ sap_sid | default(inventory_hostname) }}"
              actor: "{{ pipeline_requested_by | default('Automation') }}"
              pipeline_run_id: "{{ pipeline_run_id | default('local') }}"
              action: "{{ 'bypass' if _icinga_bypass_active | bool else 'set' }}"
              outcome: >-
                {%- if _icinga_bypass_active | bool -%}
                BYPASSED
                {%- elif _icinga_downtime_set | bool -%}
                SET
                {%- else -%}
                SKIPPED
                {%- endif -%}
              timestamp: "{{ ansible_date_time.iso8601 }}"
              bypass_active: "{{ ('true' if (_icinga_bypass_active | bool) else 'false') | from_yaml }}"
              downtime_set: "{{ ('true' if (_icinga_downtime_set | bool) else 'false') | from_yaml }}"
              remove_on_success_only: true
              requested_duration_minutes: "{{ ((downtime_duration_minutes | default(60) | int) | string) | from_yaml }}"
              downtime_duration_seconds: "{{ ((_downtime_duration_seconds | int) | string) | from_yaml }}"
              target_count: "{{ ((icinga_downtime_targets | default([]) | length) | string) | from_yaml }}"
              targets: "{{ (icinga_downtime_targets | default([]) | to_json) | from_json }}"

        - name: "Display downtime configuration"
          debug:
            msg:
              - "Duration: {{ _downtime_duration_seconds }}s ({{ (downtime_duration_minutes | default(60) | int) }} min)"
              - "Targets: {{ icinga_downtime_targets | default([]) | length }} host(s)"
              - "Bypass active: {{ _icinga_bypass_active | bool }}"

        - name: "Persist downtime audit state"
          copy:
            content: "{{ icinga_downtime_state | to_nice_yaml }}"
            dest: "{{ _state_dir }}/icinga_downtime_state.yml"
          delegate_to: localhost
          become: false

        - name: "Log Icinga bypass activation"
          debug:
            msg: "WARNING: Monitoring health gate was bypassed for this run."
          when: _icinga_bypass_active | bool

        - name: "Set Icinga Downtime"
          include_role:
            name: icinga_downtime
          vars:
            icinga_action: "set"
            icinga_url: "{{ icinga_api_url }}"
            icinga_user: "{{ icinga_api_user }}"
            icinga_password: "{{ icinga_api_pass }}"
            icinga_duration: "{{ _downtime_duration_seconds }}"
          when:
            - not (_icinga_bypass_active | bool)
            - icinga_downtime_targets | default([]) | length > 0
            - do_kernel | bool or do_hana | bool or do_os_patch | bool

        - name: "Record Maintenance Start Time"
          copy:
            content: "{{ ansible_date_time.date }} {{ ansible_date_time.time }}\n"
            dest: "{{ _state_run_dir }}/start.txt"
          delegate_to: localhost
          run_once: true
          become: false
      rescue:
        - name: "Capture downtime failure context"
          set_fact:
            _downtime_stage_failed: true
            _downtime_error_task: "{{ ansible_failed_task.name | default('Unknown task') }}"
            _downtime_error_message: "{{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default(ansible_failed_result.stdout | default('Unknown error'))) }}"
            _downtime_error_details: "{{ ansible_failed_result | default({}) | to_nice_yaml }}"

    - name: "Send downtime failure notification"
      include_tasks: tasks/send_error_notification.yml
      vars:
        _error_stage: "Icinga Downtime"
        _error_task: "{{ _downtime_error_task }}"
        _error_host: "{{ inventory_hostname }}"
        _error_message: "{{ _downtime_error_message }}"
        _error_details: "{{ _downtime_error_details }}"
      when: _downtime_stage_failed | default(false) | bool
