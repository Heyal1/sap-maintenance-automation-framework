---
# =============================================================================
# Shared Task: precheck_kernel_versions.yml
# =============================================================================
# Captures the BEFORE-state of the SAP kernel prior to a kernel update.
# Three data points are collected per host and persisted as state files on the
# Ansible controller so that validation_kernel_versions.yml can compare them
# with the AFTER-state after the update.
#
# Data collected:
#   1. SAP patch number   — via `disp+work -v` (primary version indicator)
#   2. Key executable versions — version strings for the 5 core SAP binaries:
#      disp+work, tp, R3trans, sapstartsrv, sapwebdisp (pipe-delimited output)
#   3. MD5 file inventory — fingerprint of every file in the kernel directory
#      used by validation to detect CHANGED / NEW / REMOVED files
#
# Only runs on NetWeaver hosts (is_netweaver=true).
# Included by: 03_maintenance_precheck.yml (when do_kernel=true)
# =============================================================================

- name: "Initialize kernel pre-check facts"
  set_fact:
    precheck_kernel_patch_version: "{{ precheck_undetermined_version_message }}"
    precheck_kernel_key_executable_versions:
      disp+work: "{{ precheck_undetermined_version_message }}"
      tp: "{{ precheck_undetermined_version_message }}"
      R3trans: "{{ precheck_undetermined_version_message }}"
      sapstartsrv: "{{ precheck_undetermined_version_message }}"
      sapwebdisp: "{{ precheck_undetermined_version_message }}"
    precheck_kernel_inventory_before_raw: ""
  when: is_netweaver | default(false)

# --- 1. SAP Patch Number (primary kernel version) ---------------------------
# disp+work -v outputs detailed version info; we extract the patch number
# (e.g. "773") which uniquely identifies the kernel patch level.
# LD_LIBRARY_PATH must point to the kernel directory for shared libs.
- name: "Get SAP Version BEFORE Update"
  block:
    - name: "Capture SAP patch level"
      shell: |
        set -o pipefail
        export LD_LIBRARY_PATH=/usr/sap/{{ sap_sid }}/SYS/exe/run
        cd /usr/sap/{{ sap_sid }}/SYS/exe/run
        # Primary: run disp+work -v
        version=$(timeout 10 ./disp+work -v 2>&1 | awk '/patch number/ {print $3; exit}')
        # Fallback: extract from binary strings
        if [ -z "$version" ]; then
          version=$(strings ./disp+work 2>/dev/null | awk '/patch number/ {print $3; exit}')
        fi
        if [ -z "$version" ]; then
          echo "patch number not found in disp+work output or binary" >&2
          exit 2
        fi
        printf '%s\n' "$version"
      args:
        executable: /bin/bash
      register: ver_before
      changed_when: false
      failed_when: (ver_before.rc | int) != 0

    - name: "Set SAP patch level fact"
      set_fact:
        precheck_kernel_patch_version: "{{ ver_before.stdout | trim }}"
  rescue:
    - name: "Mark SAP patch level as undetermined"
      set_fact:
        precheck_kernel_patch_version: "{{ precheck_undetermined_version_message }}"
  when: is_netweaver | default(false)

- name: "Save BEFORE Version"
  copy:
    content: "{{ precheck_kernel_patch_version }}\n"
    dest: "{{ _state_dir }}/ver_before_{{ inventory_hostname }}.txt"
  delegate_to: localhost
  become: false
  when: is_netweaver | default(false)

# --- 2. Key Executable Versions ---------------------------------------------
# These 5 binaries are the core SAP kernel executables. Tracking their
# individual versions ensures we can verify that ALL components were updated
# (not just disp+work). Output format: "executable_name|version_string"
- name: "Get Key Executable Versions BEFORE"
  block:
    - name: "Capture key executable versions"
      shell: |
        set -o pipefail
        cd /usr/sap/{{ sap_sid }}/SYS/exe/run
        export LD_LIBRARY_PATH=$(pwd)
        version_info=$(/usr/sap/hostctrl/exe/sapcontrol -nr {{ anchor_instance_nr | default('00') }} -function GetVersionInfo 2>/dev/null || true)
        for exe in disp+work tp R3trans sapstartsrv sapwebdisp; do
          ver=""
          if [ -n "$version_info" ]; then
            ver=$(printf '%s\n' "$version_info" | awk -F', ' -v exe="$exe" '$1 ~ ("/" exe "$") { if (NF >= 2) { print substr($0, index($0, $2)); exit } }')
          fi
          if [ -f "$exe" ]; then
            # Primary fallback: run executable with -v when sapcontrol does not provide the entry.
            # Skip sapstartsrv here because it behaves like a daemon and may hang instead of printing a version.
            # Fallback: extract version from binary strings (works even when -v hangs or outputs nothing)
            if [ -z "$ver" ] && [ "$exe" != "sapstartsrv" ]; then
              ver=$(timeout 10 ./"$exe" -v 2>&1 | awk 'tolower($0) ~ /patch number|release|version/ {sub(/^[[:space:]]+/, "", $0); print; exit}')
            fi
            if [ -z "$ver" ]; then
              ver=$(strings ./$exe 2>/dev/null | awk 'tolower($0) ~ /patch number/ {sub(/^[[:space:]]+/, "", $0); print; exit}')
            fi
            if [ -z "$ver" ]; then
              ver=$(strings ./$exe 2>/dev/null | awk 'tolower($0) ~ /kernel release/ {sub(/^[[:space:]]+/, "", $0); print; exit}')
            fi
          else
            ver=""
          fi
          if [ -z "$ver" ]; then
            ver="{{ precheck_undetermined_version_message }}"
          fi
          printf '%s|%s\n' "$exe" "$ver"
        done
      args:
        executable: /bin/bash
      register: key_exe_versions_before
      changed_when: false
      failed_when: (key_exe_versions_before.rc | int) != 0

    - name: "Set key executable version facts"
      set_fact:
        precheck_kernel_key_executable_versions: >-
          {%- set result = {} -%}
          {%- for line in key_exe_versions_before.stdout_lines | default([]) if '|' in line -%}
            {%- set parts = line.split('|', 1) -%}
            {%- set _ = result.update({parts[0]: parts[1] | trim}) -%}
          {%- endfor -%}
          {{ result }}
  rescue:
    - name: "Mark key executable versions as undetermined"
      set_fact:
        precheck_kernel_key_executable_versions:
          disp+work: "{{ precheck_undetermined_version_message }}"
          tp: "{{ precheck_undetermined_version_message }}"
          R3trans: "{{ precheck_undetermined_version_message }}"
          sapstartsrv: "{{ precheck_undetermined_version_message }}"
          sapwebdisp: "{{ precheck_undetermined_version_message }}"
  when: is_netweaver | default(false)

- name: "Save Key Executable Versions BEFORE"
  copy:
    content: |
      {% for exe in ['disp+work', 'tp', 'R3trans', 'sapstartsrv', 'sapwebdisp'] %}
      {{ exe }}|{{ (precheck_kernel_key_executable_versions | default({})).get(exe, precheck_undetermined_version_message) }}
      {% endfor %}
    dest: "{{ _state_dir }}/key_exe_before_{{ inventory_hostname }}.txt"
  delegate_to: localhost
  become: false
  when: is_netweaver | default(false)

# --- 3. Kernel File Inventory (MD5 fingerprints) ----------------------------
# Creates a complete MD5 checksum list of all files in the kernel directory.
# Used by validation to detect which files were CHANGED, added (NEW), or
# REMOVED during the kernel update — provides forensic-level change tracking.
- name: "Create Kernel File Inventory BEFORE (MD5)"
  block:
    - name: "Capture kernel file inventory"
      shell: |
        set -o pipefail
        cd /usr/sap/{{ sap_sid }}/SYS/exe/run
        find . -maxdepth 1 -type f -exec md5sum {} \; 2>/dev/null | sort -k2
      args:
        executable: /bin/bash
      register: kernel_file_inventory_before
      changed_when: false
      failed_when: (kernel_file_inventory_before.rc | int) != 0

    - name: "Set kernel inventory fact"
      set_fact:
        precheck_kernel_inventory_before_raw: "{{ kernel_file_inventory_before.stdout | default('') }}"
  rescue:
    - name: "Mark kernel inventory as unavailable"
      set_fact:
        precheck_kernel_inventory_before_raw: ""
  when: is_netweaver | default(false)

- name: "Save Kernel File Inventory BEFORE"
  copy:
    content: "{{ precheck_kernel_inventory_before_raw | default('') }}"
    dest: "{{ _state_dir }}/kernel_inventory_before_{{ inventory_hostname }}.txt"
  delegate_to: localhost
  become: false
  when: is_netweaver | default(false)
