---
# =============================================================================
# Shared Task: resolve_shared_hana_sid_credentials.yml
# =============================================================================
# Resolves per-SID HANA secrets for shared hosts from secret-store-backed
# environment variables using the <CUSTOMER>-HANA-<SID>-<ROLE> convention.
# =============================================================================

- name: "Initialize shared HANA credential collections"
  set_fact:
    shared_hana_sid_credentials: []
    shared_hana_sid_credentials_by_sid: {}
    shared_hana_missing_required_credentials: []
  no_log: true

- name: "Resolve shared HANA credentials per SID"
  set_fact:
    shared_hana_sid_credentials: "{{ shared_hana_sid_credentials + [_shared_hana_credential_record] }}"
    shared_hana_sid_credentials_by_sid: "{{ shared_hana_sid_credentials_by_sid | combine({_shared_tenant.sid: _shared_hana_credential_record}, recursive=true) }}"
    shared_hana_missing_required_credentials: >-
      {{
        shared_hana_missing_required_credentials
        + (
          [
            {
              'sid': _shared_tenant.sid,
              'customer': _shared_tenant.customer,
              'instance_name': _shared_instance.instance_name,
              'instance_nr': _shared_instance.instance_nr,
              'missing_roles': _shared_missing_roles
            }
          ]
          if (_shared_missing_roles | length) > 0
          else []
        )
      }}
  loop: "{{ shared_hana_instance_contexts | default([]) | subelements('tenants') }}"
  loop_control:
    loop_var: shared_hana_credential_entry
    label: "{{ shared_hana_credential_entry.1.sid }}"
  vars:
    _shared_instance: "{{ shared_hana_credential_entry.0 }}"
    _shared_tenant: "{{ shared_hana_credential_entry.1 }}"
    _shared_customer_upper: "{{ _shared_tenant.customer | upper }}"
    _shared_sid_upper: "{{ _shared_tenant.sid | upper }}"
    _shared_exact_secret_names:
      sidadm: "{{ _shared_customer_upper }}-HANA-{{ _shared_sid_upper }}-SIDADM"
      sapadm: "{{ _shared_customer_upper }}-HANA-{{ _shared_sid_upper }}-SAPADM"
      system: "{{ _shared_customer_upper }}-HANA-{{ _shared_sid_upper }}-SYSTEM"
      root: "{{ _shared_customer_upper }}-HANA-{{ _shared_sid_upper }}-ROOT"
      admin: "{{ _shared_customer_upper }}-HANA-{{ _shared_sid_upper }}-HANA_ADMIN"
    _shared_alt_secret_names:
      sidadm: "{{ _shared_customer_upper }}_HANA_{{ _shared_sid_upper }}_SIDADM"
      sapadm: "{{ _shared_customer_upper }}_HANA_{{ _shared_sid_upper }}_SAPADM"
      system: "{{ _shared_customer_upper }}_HANA_{{ _shared_sid_upper }}_SYSTEM"
      root: "{{ _shared_customer_upper }}_HANA_{{ _shared_sid_upper }}_ROOT"
      admin: "{{ _shared_customer_upper }}_HANA_{{ _shared_sid_upper }}_HANA_ADMIN"
    _shared_resolved_sidadm_password: >-
      {{
        lookup('env', _shared_exact_secret_names.sidadm)
        | default(lookup('env', _shared_alt_secret_names.sidadm), true)
        | default('', true)
      }}
    _shared_resolved_sapadm_password: >-
      {{
        lookup('env', _shared_exact_secret_names.sapadm)
        | default(lookup('env', _shared_alt_secret_names.sapadm), true)
        | default('', true)
      }}
    _shared_resolved_system_password: >-
      {{
        lookup('env', _shared_exact_secret_names.system)
        | default(lookup('env', _shared_alt_secret_names.system), true)
        | default('', true)
      }}
    _shared_resolved_root_password: >-
      {{
        lookup('env', _shared_exact_secret_names.root)
        | default(lookup('env', _shared_alt_secret_names.root), true)
        | default('', true)
      }}
    _shared_resolved_admin_password: >-
      {{
        lookup('env', _shared_exact_secret_names.admin)
        | default(lookup('env', _shared_alt_secret_names.admin), true)
        | default('', true)
      }}
    _shared_missing_roles: >-
      {{
        ([] if (_shared_resolved_sidadm_password | length) > 0 else [_shared_exact_secret_names.sidadm])
        + ([] if (_shared_resolved_sapadm_password | length) > 0 else [_shared_exact_secret_names.sapadm])
        + ([] if (_shared_resolved_system_password | length) > 0 else [_shared_exact_secret_names.system])
        + ([] if (_shared_resolved_root_password | length) > 0 else [_shared_exact_secret_names.root])
      }}
    _shared_hana_credential_record:
      sid: "{{ _shared_tenant.sid }}"
      customer: "{{ _shared_tenant.customer }}"
      instance_name: "{{ _shared_instance.instance_name }}"
      instance_nr: "{{ _shared_instance.instance_nr }}"
      update_tier: "{{ _shared_tenant.update_tier }}"
      tier_rank: "{{ _shared_tenant.tier_rank | int }}"
      admin_user: "{{ lookup('env', 'HANA_ADMIN_USER') | default('HANA_ADMIN', true) }}"
      sidadm_password: "{{ _shared_resolved_sidadm_password }}"
      sapadm_password: "{{ _shared_resolved_sapadm_password }}"
      system_user_password: "{{ _shared_resolved_system_password }}"
      root_password: "{{ _shared_resolved_root_password }}"
      admin_password: "{{ _shared_resolved_admin_password }}"
      secret_names:
        sidadm: "{{ _shared_exact_secret_names.sidadm }}"
        sapadm: "{{ _shared_exact_secret_names.sapadm }}"
        system: "{{ _shared_exact_secret_names.system }}"
        root: "{{ _shared_exact_secret_names.root }}"
        admin: "{{ _shared_exact_secret_names.admin }}"
  no_log: true

- name: "Fail when shared HANA credentials are missing"
  fail:
    msg: >-
      Missing required shared HANA credentials:
      {%- for item in shared_hana_missing_required_credentials -%}
      SID {{ item.sid }} ({{ item.customer }}, {{ item.instance_name }}): {{ item.missing_roles | join(', ') }}{% if not loop.last %}; {% endif %}
      {%- endfor -%}
  when: (shared_hana_missing_required_credentials | default([]) | length) > 0
